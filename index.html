<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Cremers — Californian Specials</title>

<style>
:root{
  --g:#b5852f;
  --gl:#d8b46d;
  --ln:#dfcfaa;
  --b:#111;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:#fff!important;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

body{overflow-x:hidden}

.screen{
  position:relative;
  width:min(100vw,56.25vh);
  height:min(177.7778vw,100vh);
  margin:auto;
  background:#fff;
  overflow:hidden;
}

@media(max-aspect-ratio:9/16){
  .screen{
    width:100vw;
    height:177.7778vw;
  }
}

.frame{
  position:absolute;
  inset:1.2%;
  border:1px solid var(--g);
  padding:2.1% 3%;
}

.brand{text-align:center}

.brand img{
  width:36%;
  max-height:8%;
  object-fit:contain;
}

.kicker{
  font-size:clamp(7px,1vw,27px);
  letter-spacing:.28em;
  text-transform:uppercase;
}

h1{
  margin:.8% 0 0;
  font:500 clamp(32px,5.4vw,118px)/.9 Georgia,serif;
  text-transform:uppercase;
}

h1 span{
  display:block;
  color:var(--g);
  font-size:70%;
  letter-spacing:.2em;
  margin-top:.6%;
}

.orn{
  width:42%;
  margin:.8% auto 3.5%;
  color:var(--g);
  display:flex;
  align-items:center;
  gap:10px;
}

.orn:before,.orn:after{
  content:"";
  height:1px;
  background:var(--g);
  flex:1;
}

.menu{
  width:98%;
  margin:auto;
  display:grid;
  grid-template-columns:.80fr 1fr 1fr;
  gap:1.4%;
  align-items:start;
}

.panel{
  border:1px solid var(--ln);
  border-radius:7px;
  padding:3% 3.2%;
  background:#fff;
}

.head{
  margin:-8% 0 3%;
  padding:3.8% 2%;
  border:2px solid var(--g);
  border-radius:6px;
  background:var(--b);
  color:var(--gl);
  text-align:center;
  font-size:clamp(10px,1.45vw,37px);
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.item{
  border-bottom:1px solid rgba(181,133,47,.30);
}

/* 3.5 GRAM PREFAB */

.prefab .item{
  padding:7.3% 0 7.8%;
}

.prefab .top{
  display:grid;
  grid-template-columns:minmax(0,68%) 32%;
  align-items:start;
  gap:4px;
}

.prefab .name{
  font:700 clamp(13px,1.89vw,46px)/1.04 Georgia,serif;
  text-transform:uppercase;
  padding-right:5%;
  letter-spacing:-.015em;
}

.prefab .price{
  font-size:clamp(13px,1.76vw,43px);
  font-weight:800;
  text-align:right;
  white-space:nowrap;
}

.prefab .farmline{
  margin-top:3%;
  font-size:clamp(8px,1.14vw,28px);
  color:var(--g);
  font-weight:800;
  text-transform:uppercase;
}

.prefab .genetics{
  margin-top:2.4%;
  font-size:clamp(8px,1.12vw,27px);
  font-weight:800;
  letter-spacing:.02em;
  text-transform:uppercase;
}

.prefab .deal{margin-top:3%}

/* 1 GRAM — larger again, but still controlled */

.one .item{
  padding:3.85% 0 4.15%;
}

.one .top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:7px;
  align-items:baseline;
}

.one .name{
  font-size:clamp(11px,1.79vw,44px);
  line-height:1.02;
  font-weight:800;
  text-transform:uppercase;
  overflow-wrap:anywhere;
}

.one .price{
  font-size:clamp(11px,1.65vw,41px);
  font-weight:800;
  white-space:nowrap;
}

.one .farmline{
  margin-top:1.8%;
  color:var(--g);
  font-size:clamp(8px,1.07vw,26px);
  font-weight:800;
  text-transform:uppercase;
}

.one .genetics{
  margin-top:1.5%;
  font-size:clamp(8px,1.05vw,25px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:.015em;
  text-transform:uppercase;
}

.one .deal{margin-top:1.8%}

.genetics{color:#111}
.genetics .indica,.genetics .sativa{white-space:nowrap}
.genetics .dot{color:var(--g);margin:0 .25em}

.deal{
  display:inline-block;
  background:var(--g);
  color:#fff;
  padding:2px 5px;
  border-radius:3px;
  font-size:clamp(6px,.82vw,20px);
  font-weight:800;
  text-transform:uppercase;
  white-space:nowrap;
}

.leaves{
  margin:9% auto 2%;
  text-align:center;
  color:var(--g);
  font:clamp(18px,3vw,62px) Georgia,serif;
}

.footer{
  position:absolute;
  left:9%;
  right:9%;
  bottom:1.1%;
  padding:1.05% 2%;
  background:var(--b);
  color:var(--gl);
  border:2px solid var(--g);
  border-radius:6px;
  text-align:center;
}

.footer strong{
  display:block;
  font-size:clamp(9px,1.2vw,30px);
  letter-spacing:.15em;
  text-transform:uppercase;
}

.footer small{
  display:block;
  margin-top:.25%;
  font-size:clamp(6px,.7vw,18px);
  letter-spacing:.1em;
  text-transform:uppercase;
}

#loading{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:var(--g);
  text-transform:uppercase;
}
</style>
</head>

<body>
<main class="screen">
<div class="frame">

<header class="brand">
  <img src="cremers-logo.png" alt="Cremers">
  <div class="kicker">Coffeeshop · Since 1990</div>
  <h1>Californian<span>Specials</span></h1>
  <div class="orn">✦</div>
</header>

<div id="loading">Loading menu…</div>

<section id="menu" class="menu" hidden>

  <div class="panel prefab">
    <div class="head">❧ 3.5 Gram Prefab ❧</div>
    <div id="prefab"></div>
    <div class="leaves">❧ ❧ ❧</div>
  </div>

  <div class="panel one">
    <div class="head">❧ 1 Gram ❧</div>
    <div id="oneA"></div>
  </div>

  <div class="panel one">
    <div class="head">❧ 1 Gram ❧</div>
    <div id="oneB"></div>
  </div>

</section>

<footer class="footer">
  <strong>Premium Californian Genetics</strong>
  <small>Carefully selected · Properly grown · Perfectly cured</small>
</footer>

</div>
</main>

<script>
const URL =
"https://script.google.com/macros/s/AKfycbx2tgVQp13EdurZ22_HAafU_DK_9EKnx6bQRdx8JLLBedQr9J7xQxkxICfOwsWgpVveYA/exec";

const ok = v =>
  ["true","yes","1","x","✓","checked"]
  .includes(String(v || "").trim().toLowerCase());

const safe = v =>
  String(v || "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");

function euro(v){
  const raw =
    String(v || "")
    .trim()
    .replace("€","")
    .replace(",",".");
  const n = Number(raw);

  return Number.isFinite(n)
    ? "€" + n.toLocaleString(
        "nl-NL",
        {
          minimumFractionDigits:n % 1 ? 2 : 0,
          maximumFractionDigits:2
        }
      )
    : safe(v);
}

function genetics(x){
  const indica = String(x["Indica %"] || "").trim();
  const sativa = String(x["Sativa %"] || "").trim();

  if(!indica && !sativa) return "";

  const parts = [];

  if(indica){
    parts.push(`<span class="indica">${safe(indica)}% Indica</span>`);
  }

  if(sativa){
    parts.push(`<span class="sativa">${safe(sativa)}% Sativa</span>`);
  }

  return `
    <div class="genetics">
      ${parts.join('<span class="dot">·</span>')}
    </div>
  `;
}

function card(x){
  return `
    <article class="item">
      <div class="top">
        <div class="name">${safe(x.Product)}</div>
        <div class="price">${euro(x.Price)}</div>
      </div>

      ${x.Farm ? `<div class="farmline">${safe(x.Farm)}</div>` : ""}

      ${genetics(x)}

      ${x.Deal ? `<span class="deal">${safe(x.Deal)}</span>` : ""}
    </article>
  `;
}

function cremersMenuData(rows){

  const all =
    rows.filter(
      x =>
        String(x.Screen).trim() === "1" &&
        ok(x.Available) &&
        x.Product
    );

  const pre =
    all.filter(
      x =>
        String(x.Section)
        .toLowerCase()
        .includes("3.5")
    );

  const one =
    all.filter(
      x =>
        String(x.Section)
        .toLowerCase()
        .includes("1 gram")
    );

  const half = Math.ceil(one.length / 2);

  document.getElementById("prefab").innerHTML =
    pre.map(card).join("");

  document.getElementById("oneA").innerHTML =
    one.slice(0,half).map(card).join("");

  document.getElementById("oneB").innerHTML =
    one.slice(half).map(card).join("");

  document.getElementById("loading").hidden = true;
  document.getElementById("menu").hidden = false;

  localStorage.setItem("cremersCache",JSON.stringify(rows));
}

try{
  const cache =
    JSON.parse(localStorage.getItem("cremersCache"));

  if(cache){
    cremersMenuData(cache);
  }
}catch(e){}

async function refresh(){

  try{

    const response =
      await fetch(
        URL + "?_=" + Date.now(),
        {cache:"no-store"}
      );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const text = await response.text();
    let rows;

    try{
      rows = JSON.parse(text);
    }catch(e){

      const match =
        text.match(/^[^(]*\((.*)\)\s*;?\s*$/s);

      if(!match){
        throw new Error("Unexpected Apps Script response");
      }

      rows = JSON.parse(match[1]);
    }

    if(!Array.isArray(rows)){
      throw new Error("Menu data is not an array");
    }

    cremersMenuData(rows);

  }catch(error){

    console.error("Live menu update failed:",error);

    const loading =
      document.getElementById("loading");

    if(!document.getElementById("menu").hidden){
      loading.hidden = true;
    }else{
      loading.textContent =
        "Menu data is taking longer than expected…";
    }
  }
}

refresh();
setInterval(refresh,60000);

/* Reload the whole HTML periodically so future GitHub HTML changes
   can appear without changing the saved TV URL. */
setInterval(() => {
  window.location.reload();
}, 600000);

</script>
</body>
</html>
