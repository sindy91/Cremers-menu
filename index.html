<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">

<title>Cremers — Californian Specials</title>

<style>
:root{
  color-scheme:only light;
  --gold:#b5852f;
  --gold2:#d8b46d;
  --line:#dfcfaa;
  --ink:#111;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:#fff!important;
  color:#111!important;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

/*
  This IS the 9:16 TV.
  No transform, no JavaScript scaling.
*/
.screen{
  position:relative;

  width:min(100vw,56.25vh);
  height:min(177.7778vw,100vh);

  min-width:0;

  margin:0 auto;

  background:#fff;

  overflow:hidden;
}

/*
  On a narrow phone we allow the entire
  9:16 canvas to extend vertically.
*/
@media (max-aspect-ratio:9/16){
  .screen{
    width:100vw;
    height:177.7778vw;
  }
}

.inner{
  position:absolute;
  inset:1.3% 2.5%;

  border:1px solid var(--gold);

  padding:2.2% 3%;
}

.brand{
  text-align:center;
}

.brand img{
  width:35%;
  max-height:7.2%;
  object-fit:contain;
}

.kicker{
  margin-top:.2%;
  font-size:clamp(7px,1vw,28px);
  letter-spacing:.30em;
  text-transform:uppercase;
}

.title{
  margin:1% 0 0;

  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(30px,5.5vw,118px);
  font-weight:500;
  line-height:.88;

  text-transform:uppercase;
}

.title span{
  display:block;

  margin-top:.7%;

  color:var(--gold);

  font-size:73%;

  letter-spacing:.20em;
}

.ornament{
  width:40%;
  margin:.8% auto 0;

  display:flex;
  align-items:center;
  gap:12px;

  color:var(--gold);
}

.ornament::before,
.ornament::after{
  content:"";
  height:1px;
  flex:1;
  background:var(--gold);
}

.menu{
  width:96%;

  margin:3.1% auto 0;

  display:grid;
  grid-template-columns:.74fr 1fr 1fr;

  gap:1.4%;

  align-items:start;
}

.panel{
  position:relative;

  min-width:0;

  border:1px solid var(--line);
  border-radius:7px;

  padding:2.5% 3%;

  background:#fff;
}

.panel-title{
  margin:-8% 0 4%;

  padding:3.8% 2%;

  border:2px solid var(--gold);
  border-radius:6px;

  background:#111;
  color:var(--gold2);

  text-align:center;

  font-size:clamp(9px,1.45vw,38px);
  font-weight:800;

  letter-spacing:.08em;

  text-transform:uppercase;
}

.prefab .item{
  padding:8% 0 9%;

  border-bottom:1px solid rgba(181,133,47,.32);
}
