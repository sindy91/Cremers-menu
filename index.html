<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Cremers — Californian Specials</title>
<style>
  :root {
    color-scheme: only light;
    --white: #ffffff;
    --ink: #111111;
    --muted: #716a60;
    --gold: #b58a3d;
    --gold-soft: #d7bd8d;
    --line: #e4ded3;
    --black: #151515;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #ffffff !important;
    color: #111111 !important;
    forced-color-adjust: none;
    -webkit-text-size-adjust: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: -1000;
    pointer-events: none;
  }

  * {
    box-sizing: border-box;
    forced-color-adjust: none;
  }

  .viewport {
    width: 100vw;
    height: 100vh;
    background: #ffffff !important;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
  }

  .scaler {
    position: relative;
    flex: none;
  }

  .screen {
    width: 2160px;
    height: 3840px;
    transform-origin: top left;
    background:
      linear-gradient(rgba(255,255,255,.97), rgba(255,255,255,.97)),
      radial-gradient(circle at 15% 10%, rgba(181,138,61,.06), transparent 28%),
      radial-gradient(circle at 88% 92%, rgba(181,138,61,.05), transparent 25%);
    color: var(--ink);
    padding: 118px 118px 92px;
    overflow: hidden;
  }

  .brand {
    text-align: center;
  }

  .brand img {
    display: block;
    width: 820px;
    max-height: 330px;
    object-fit: contain;
    margin: 0 auto 28px;
    filter: none !important;
  }

  .top-rule {
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 10px 0 40px;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 90px;
    line-height: 1;
    font-weight: 500;
    letter-spacing: .09em;
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: 18px;
    text-align: center;
    font-size: 28px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .menu {
    margin-top: 74px;
    display: grid;
    grid-template-columns: .78fr 1.42fr;
    gap: 70px;
    height: 2940px;
  }

  .section {
    min-width: 0;
  }

  .section + .section {
    border-left: 2px solid var(--line);
    padding-left: 70px;
  }

  .section-title {
    background: var(--black);
    color: #d8b06a;
    border: 1px solid #2b2b2b;
    border-radius: 8px;
    text-align: center;
    padding: 24px 22px;
    margin-bottom: 34px;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .items {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .item {
    border-bottom: 2px solid var(--line);
    padding: 0 0 13px;
  }

  .topline {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 24px;
    align-items: baseline;
  }

  .name {
    font-size: 33px;
    line-height: 1.07;
    font-weight: 800;
    letter-spacing: .01em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }

  .price {
    font-size: 35px;
    line-height: 1;
    font-weight: 800;
    white-space: nowrap;
  }

  .meta {
    margin-top: 7px;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    font-size: 22px;
    line-height: 1.15;
    color: var(--muted);
  }

  .farm {
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .deal {
    color: var(--gold);
    font-weight: 800;
    white-space: nowrap;
  }

  .status {
    margin-top: 140px;
    text-align: center;
    font-size: 30px;
    letter-spacing: .06em;
    color: var(--muted);
  }

  .footer {
    margin-top: 54px;
    border-top: 2px solid var(--line);
    padding-top: 23px;
    text-align: center;
    color: var(--muted);
    font-size: 22px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="viewport">
  <div class="scaler" id="scaler">
    <main class="screen" id="screen">
      <header class="brand">
        <img src="cremers-logo.png" alt="Cremers Est. 1990">
        <div class="top-rule"></div>
        <h1>Californian Specials</h1>
        <div class="subtitle">Premium selection</div>
      </header>

      <div id="status" class="status">Loading menu…</div>

      <section id="menu" class="menu" hidden>
        <div class="section">
          <div class="section-title">3.5 Gram Prefab</div>
          <div id="prefab" class="items"></div>
        </div>

        <div class="section">
          <div class="section-title">1 Gram</div>
          <div id="onegram" class="items"></div>
        </div>
      </section>

      <footer class="footer">
        Premium California · Premium Quality · Cremers Est. 1990
      </footer>
    </main>
  </div>
</div>

<script>
const DATA_URL = "https://script.google.com/macros/s/AKfycbzyziBjFgHMdxzKvToZ_4Hs5j7gF4xD6Vzk67F6ylPQwzEHN_jNrbtWa6TKtUKXizrdbw/exec";
let refreshScript = null;

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function isAvailable(value) {
  return ["true", "yes", "1", "x", "✓", "checked"]
    .includes(String(value ?? "").trim().toLowerCase());
}

function euro(value) {
  const raw = String(value ?? "").trim().replace(",", ".");
  const n = Number(raw);
  if (!Number.isFinite(n)) return esc(value);

  return "€" + n.toLocaleString("nl-NL", {
    minimumFractionDigits: n % 1 === 0 ? 0 : 2,
    maximumFractionDigits: 2
  });
}

function itemHtml(item) {
  const deal = item.Deal
    ? `<span class="deal">${esc(item.Deal)}</span>`
    : "";

  return `
    <article class="item">
      <div class="topline">
        <div class="name">${esc(item.Product)}</div>
        <div class="price">${euro(item.Price)}</div>
      </div>
      <div class="meta">
        <span class="farm">${esc(item.Farm || "")}</span>
        ${deal}
      </div>
    </article>
  `;
}

function cremersMenuData(rows) {
  try {
    const screen1 = rows.filter(row =>
      String(row.Screen ?? "").trim() === "1" &&
      isAvailable(row.Available) &&
      String(row.Product ?? "").trim() !== ""
    );

    const prefab = screen1.filter(row =>
      String(row.Section ?? "").toLowerCase().includes("3.5")
    );

    const onegram = screen1.filter(row =>
      String(row.Section ?? "").toLowerCase().includes("1 gram")
    );

    document.getElementById("prefab").innerHTML = prefab.map(itemHtml).join("");
    document.getElementById("onegram").innerHTML = onegram.map(itemHtml).join("");

    document.getElementById("status").hidden = true;
    document.getElementById("menu").hidden = false;
    fitToViewport();
  } catch (err) {
    console.error(err);
    document.getElementById("status").textContent = "Menu temporarily unavailable";
  }
}

function loadMenu() {
  if (refreshScript) refreshScript.remove();

  refreshScript = document.createElement("script");
  refreshScript.src =
    DATA_URL +
    "?callback=cremersMenuData&_=" +
    Date.now();

  refreshScript.onerror = () => {
    document.getElementById("status").textContent = "Menu temporarily unavailable";
  };

  document.body.appendChild(refreshScript);
}

function fitToViewport() {
  const screen = document.getElementById("screen");
  const scaler = document.getElementById("scaler");

  const scale = Math.min(
    window.innerWidth / 2160,
    window.innerHeight / 3840
  );

  screen.style.transform = `scale(${scale})`;
  scaler.style.width = `${2160 * scale}px`;
  scaler.style.height = `${3840 * scale}px`;
}

window.addEventListener("resize", fitToViewport);
fitToViewport();
loadMenu();
setInterval(loadMenu, 60000);
</script>
</body>
</html>
