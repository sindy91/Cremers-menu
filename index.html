<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Cremers — Californian Specials</title>
<style>
:root{
  color-scheme:only light;
  --cream:#f5efe3;
  --cream2:#fbf8f1;
  --ink:#11110f;
  --gold:#b5852f;
  --gold2:#d5b26a;
  --muted:#7c6a4d;
  --line:#d9c8a5;
  --black:#111;
}
*{box-sizing:border-box;forced-color-adjust:none}
html,body{
  margin:0;
  background:var(--cream)!important;
  color:var(--ink)!important;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-text-size-adjust:100%;
}
body{min-height:100vh}
.viewport{
  width:100vw;height:100vh;overflow:hidden;
  display:flex;justify-content:center;align-items:flex-start;
  background:var(--cream)!important;
}
.scaler{position:relative;flex:none}
.screen{
  width:2160px;height:3840px;transform-origin:top left;
  background:
    radial-gradient(circle at 50% 8%, rgba(255,255,255,.85), transparent 26%),
    linear-gradient(180deg,var(--cream2) 0%,var(--cream) 100%);
  padding:90px 86px 78px;
  position:relative;overflow:hidden;
}
.screen:before{
  content:"";position:absolute;inset:28px;
  border:4px solid var(--gold);pointer-events:none;
}
.corner{
  position:absolute;font-family:Georgia,serif;color:var(--gold);
  font-size:56px;line-height:1;z-index:2;
}
.c1{left:42px;top:34px}.c2{right:42px;top:34px;transform:scaleX(-1)}
.c3{left:42px;bottom:34px;transform:scaleY(-1)}
.c4{right:42px;bottom:34px;transform:scale(-1)}

.brand{text-align:center;position:relative;z-index:1}
.brand img{
  width:690px;max-height:245px;object-fit:contain;
  display:block;margin:0 auto 8px;
}
.kicker{
  margin-top:4px;
  font-size:26px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);
}
.title{
  margin:34px 0 0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:118px;line-height:.9;font-weight:500;
  letter-spacing:.04em;text-transform:uppercase;
}
.title span{
  display:block;color:var(--gold);letter-spacing:.22em;
  font-size:88px;margin-top:24px;
}
.ornament{
  margin:24px auto 0;width:760px;display:flex;align-items:center;gap:20px;color:var(--gold)
}
.ornament:before,.ornament:after{content:"";height:2px;background:var(--gold);flex:1;opacity:.7}
.ornament b{font-size:34px;font-weight:400}

.menu{
  margin-top:72px;height:2860px;
  display:grid;grid-template-columns:.95fr 1.2fr;gap:62px;
}
.panel{
  position:relative;border:2px solid var(--line);
  background:rgba(255,255,255,.46);
  box-shadow:0 10px 32px rgba(80,55,15,.06);
  padding:34px 34px 30px;
  border-radius:18px;
}
.panel-title{
  margin:-60px 0 34px;
  background:var(--black);color:var(--gold2);
  border:4px solid var(--gold);
  border-radius:14px;
  padding:22px 30px;text-align:center;
  font-size:42px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;
}
.panel-title:before{content:"❧";margin-right:18px;color:var(--gold)}
.panel-title:after{content:"❧";margin-left:18px;color:var(--gold);display:inline-block;transform:scaleX(-1)}

.items{display:flex;flex-direction:column}
.item{
  border-bottom:2px solid rgba(181,133,47,.32);
  position:relative;
}
.prefab .item{padding:30px 0 34px}
.onegram .item{padding:8px 0 10px}
.topline{
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  align-items:baseline;gap:22px;
}
.prefab .name{
  font-family:Georgia,"Times New Roman",serif;
  font-size:54px;line-height:1.04;font-weight:700;text-transform:uppercase;
}
.prefab .price{font-size:50px;font-weight:800}
.onegram .name{
  font-size:29px;line-height:1.02;font-weight:800;text-transform:uppercase;
}
.onegram .price{font-size:30px;font-weight:800}
.meta{
  display:flex;justify-content:space-between;gap:18px;
  color:var(--gold);text-transform:uppercase;font-weight:700;
}
.prefab .meta{margin-top:12px;font-size:23px;letter-spacing:.05em}
.onegram .meta{margin-top:4px;font-size:16px;letter-spacing:.035em}
.deal{
  color:#fff;background:var(--gold);padding:5px 9px;border-radius:5px;
  white-space:nowrap;font-weight:800;
}
.wheat{
  margin:34px auto 0;
  width:78%;text-align:center;color:var(--gold);
  font-family:Georgia,serif;font-size:50px;letter-spacing:.08em;
}
.footer{
  margin:54px auto 0;width:82%;
  background:var(--black);color:var(--gold2);
  border:4px solid var(--gold);border-radius:14px;
  padding:24px 36px;text-align:center;
}
.footer strong{
  display:block;font-size:29px;letter-spacing:.16em;text-transform:uppercase
}
.footer span{
  display:block;margin-top:8px;font-size:17px;letter-spacing:.14em;text-transform:uppercase
}
.status{
  margin-top:120px;text-align:center;font-size:30px;color:var(--muted)
}
</style>
</head>
<body>
<div class="viewport">
  <div class="scaler" id="scaler">
    <main class="screen" id="screen">
      <div class="corner c1">⌜</div><div class="corner c2">⌜</div>
      <div class="corner c3">⌜</div><div class="corner c4">⌜</div>

      <header class="brand">
        <img src="cremers-logo.png" alt="Cremers Est. 1990">
        <div class="kicker">Coffeeshop · Since 1990</div>
        <h1 class="title">Californian <span>Specials</span></h1>
        <div class="ornament"><b>✦</b></div>
      </header>

      <div id="status" class="status">Loading menu…</div>

      <section id="menu" class="menu" hidden>
        <div class="panel prefab">
          <div class="panel-title">3.5 Gram Prefab</div>
          <div id="prefab" class="items"></div>
          <div class="wheat">❧ ❧ ❧</div>
        </div>

        <div class="panel onegram">
          <div class="panel-title">1 Gram</div>
          <div id="onegram" class="items"></div>
        </div>
      </section>

      <footer class="footer">
        <strong>Premium Californian Genetics</strong>
        <span>Carefully selected · Properly grown · Perfectly cured</span>
      </footer>
    </main>
  </div>
</div>

<script>
const DATA_URL = "https://script.google.com/macros/s/AKfycbzyziBjFgHMdxzKvToZ_4Hs5j7gF4xD6Vzk67F6ylPQwzEHN_jNrbtWa6TKtUKXizrdbw/exec";
let loader;

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function yes(v){
  return ["true","yes","1","x","✓","checked"].includes(String(v ?? "").trim().toLowerCase());
}
function euro(v){
  const n=Number(String(v ?? "").trim().replace(",","."));
  if(!Number.isFinite(n)) return esc(v);
  return "€"+n.toLocaleString("nl-NL",{
    minimumFractionDigits:n%1===0?0:2,maximumFractionDigits:2
  });
}
function rowHTML(x){
  return `<article class="item">
    <div class="topline">
      <div class="name">${esc(x.Product)}</div>
      <div class="price">${euro(x.Price)}</div>
    </div>
    <div class="meta">
      <span>${esc(x.Farm||"")}</span>
      ${x.Deal ? `<span class="deal">${esc(x.Deal)}</span>` : ""}
    </div>
  </article>`;
}
function cremersMenuData(rows){
  try{
    const data=rows.filter(r =>
      String(r.Screen ?? "").trim()==="1" &&
      yes(r.Available) &&
      String(r.Product ?? "").trim()!==""
    );
    const prefab=data.filter(r=>String(r.Section??"").toLowerCase().includes("3.5"));
    const one=data.filter(r=>String(r.Section??"").toLowerCase().includes("1 gram"));

    document.getElementById("prefab").innerHTML=prefab.map(rowHTML).join("");
    document.getElementById("onegram").innerHTML=one.map(rowHTML).join("");
    document.getElementById("status").hidden=true;
    document.getElementById("menu").hidden=false;
    fit();
  }catch(e){
    console.error(e);
    document.getElementById("status").textContent="Menu temporarily unavailable";
  }
}
function load(){
  if(loader) loader.remove();
  loader=document.createElement("script");
  loader.src=DATA_URL+"?callback=cremersMenuData&_="+Date.now();
  loader.onerror=()=>document.getElementById("status").textContent="Menu temporarily unavailable";
  document.body.appendChild(loader);
}
function fit(){
  const s=document.getElementById("screen");
  const c=document.getElementById("scaler");
  const scale=Math.min(innerWidth/2160,innerHeight/3840);
  s.style.transform=`scale(${scale})`;
  c.style.width=(2160*scale)+"px";
  c.style.height=(3840*scale)+"px";
}
addEventListener("resize",fit);
fit();load();setInterval(load,60000);
</script>
</body>
</html>
