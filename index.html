<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cremers — Californian Specials</title>
<style>
  :root {
    --paper: #fbfaf7;
    --ink: #111111;
    --muted: #716a60;
    --gold: #a78345;
    --line: #d8d0c3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #ddd;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* Exact target aspect ratio: 2160 × 3840 */
  .screen {
    width: min(100vw, calc(100vh * 0.5625));
    min-height: 100vh;
    aspect-ratio: 9 / 16;
    background: var(--paper);
    padding: 4.2% 5.4% 4.3%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .brand {
    text-align: center;
    flex: 0 0 auto;
  }

  .brand img {
    width: 58%;
    max-width: 980px;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  .rule {
    height: 1px;
    background: var(--line);
    margin: 1.4% 0 1.7%;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-weight: 500;
    letter-spacing: .16em;
    font-size: clamp(28px, 3vw, 96px);
    text-transform: uppercase;
  }

  .subtitle {
    margin-top: .7%;
    text-align: center;
    color: var(--muted);
    font-size: clamp(12px, 1vw, 34px);
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .menu-grid {
    flex: 1 1 auto;
    min-height: 0;
    margin-top: 2.3%;
    display: grid;
    grid-template-columns: 1fr 1.65fr;
    gap: 4.2%;
  }

  .section {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .section + .section {
    border-left: 1px solid var(--line);
    padding-left: 4.2%;
  }

  .section-title {
    border: 1px solid var(--gold);
    padding: 1.5% 3%;
    text-align: center;
    letter-spacing: .13em;
    font-weight: 700;
    font-size: clamp(15px, 1.25vw, 42px);
    text-transform: uppercase;
    margin-bottom: 3.3%;
  }

  .items {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, .68vh, 30px);
  }

  .item {
    padding-bottom: clamp(7px, .45vh, 20px);
    border-bottom: 1px dotted #cfc7bc;
  }

  .topline {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 18px;
    align-items: baseline;
  }

  .name {
    font-weight: 700;
    font-size: clamp(17px, 1.42vw, 50px);
    line-height: 1.06;
    letter-spacing: .015em;
    text-transform: uppercase;
    overflow-wrap: anywhere;
  }

  .price {
    font-weight: 700;
    font-size: clamp(18px, 1.48vw, 52px);
    white-space: nowrap;
  }

  .meta {
    margin-top: .45%;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    color: var(--muted);
    font-size: clamp(11px, .86vw, 29px);
    line-height: 1.15;
  }

  .farm {
    text-transform: uppercase;
    letter-spacing: .075em;
  }

  .deal {
    color: var(--gold);
    font-weight: 700;
    text-align: right;
    white-space: nowrap;
  }

  .footer {
    flex: 0 0 auto;
    margin-top: 2%;
    border-top: 1px solid var(--line);
    padding-top: 1.1%;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    color: var(--muted);
    font-size: clamp(10px, .75vw, 24px);
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .status {
    text-align: center;
    margin-top: 6%;
    color: var(--muted);
    font-size: clamp(16px, 1.2vw, 38px);
  }

  @media (max-aspect-ratio: 9/16) {
    .screen {
      width: 100vw;
      min-height: auto;
      height: calc(100vw * 16 / 9);
    }
  }
</style>
</head>
<body>
<main class="screen">
  <header class="brand">
    <img src="cremers-logo.png" alt="Cremers — Est. 1990">
    <div class="rule"></div>
    <h1>Californian Specials</h1>
    <div class="subtitle">Premium selection</div>
  </header>

  <div id="status" class="status">Loading menu…</div>

  <section id="menu" class="menu-grid" hidden>
    <div class="section">
      <div class="section-title">3.5 Gram Prefab</div>
      <div class="items" id="prefab-items"></div>
    </div>

    <div class="section">
      <div class="section-title">1 Gram</div>
      <div class="items" id="onegram-items"></div>
    </div>
  </section>

  <footer class="footer">
    <span>Premium California · Premium Quality</span>
    <span>Cremers · Est. 1990</span>
  </footer>
</main>

<script>
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJCoa61jffwkjHzCWynvWuD-LlPhU4ECrA8LdzDKaCwaM63zkcB43EznQoecinLaZQqse4KyoXSSbL/pub?output=csv";

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];

    if (c === '"') {
      if (quoted && next === '"') {
        field += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === ',' && !quoted) {
      row.push(field);
      field = "";
    } else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && next === '\n') i++;
      row.push(field);
      if (row.some(v => v !== "")) rows.push(row);
      row = [];
      field = "";
    } else {
      field += c;
    }
  }
  row.push(field);
  if (row.some(v => v !== "")) rows.push(row);
  return rows;
}

function euro(value) {
  const n = Number(String(value).replace(',', '.'));
  if (!Number.isFinite(n)) return value;
  return new Intl.NumberFormat('nl-NL', {
    style: 'currency',
    currency: 'EUR',
    minimumFractionDigits: n % 1 === 0 ? 0 : 2,
    maximumFractionDigits: 2
  }).format(n);
}

function truthy(value) {
  return ['true','yes','1','x','✓','checked'].includes(String(value).trim().toLowerCase());
}

function makeItem(item) {
  const el = document.createElement('article');
  el.className = 'item';

  const deal = item.Deal ? `<span class="deal">${escapeHtml(item.Deal)}</span>` : '';

  el.innerHTML = `
    <div class="topline">
      <div class="name">${escapeHtml(item.Product)}</div>
      <div class="price">${euro(item.Price)}</div>
    </div>
    <div class="meta">
      <span class="farm">${escapeHtml(item.Farm || '')}</span>
      ${deal}
    </div>`;
  return el;
}

function escapeHtml(str) {
  return String(str ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

async function loadMenu() {
  const status = document.getElementById('status');
  const menu = document.getElementById('menu');

  try {
    const response = await fetch(SHEET_CSV, { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not read Google Sheet');
    const text = await response.text();
    const data = parseCSV(text);
    if (data.length < 2) throw new Error('The Sheet is empty');

    const headers = data[0].map(h => h.trim());
    const items = data.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (row[i] ?? '').trim());
      return obj;
    }).filter(x =>
      String(x.Screen).trim() === '1' &&
      truthy(x.Available) &&
      x.Product
    );

    const prefab = items.filter(x => x.Section.toLowerCase().includes('3.5'));
    const onegram = items.filter(x => x.Section.toLowerCase().includes('1 gram'));

    const prefabEl = document.getElementById('prefab-items');
    const onegramEl = document.getElementById('onegram-items');
    prefabEl.innerHTML = '';
    onegramEl.innerHTML = '';

    prefab.forEach(x => prefabEl.appendChild(makeItem(x)));
    onegram.forEach(x => onegramEl.appendChild(makeItem(x)));

    status.hidden = true;
    menu.hidden = false;
  } catch (err) {
    console.error(err);
    status.textContent = 'Menu temporarily unavailable';
  }
}

loadMenu();
// Refresh automatically so a Sheet change reaches the screen without reloading the page.
setInterval(loadMenu, 60000);
</script>
</body>
</html>
