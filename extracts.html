<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Cremers — Premium Extracts</title>

<style>
:root{--gold:#b5852f;--gold2:#d8b46d;--line:#dfcfaa;--black:#111}
*{box-sizing:border-box}
html,body{margin:0;background:#fff!important;color:#111;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
.screen{position:relative;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);margin:auto;background:#fff;overflow:hidden}
@media(max-aspect-ratio:9/16){.screen{width:100vw;height:177.7778vw}}
.frame{position:absolute;inset:1.2%;border:1px solid var(--gold);padding:2.3% 3%}
.brand{text-align:center}
.brand img{width:36%;max-height:8%;object-fit:contain}
.kicker{font-size:clamp(7px,1vw,28px);letter-spacing:.28em;text-transform:uppercase}
h1{margin:1% 0 0;font:500 clamp(31px,5.7vw,122px)/.9 Georgia,"Times New Roman",serif;text-transform:uppercase}
h1 span{display:block;color:var(--gold);font-size:48%;letter-spacing:.20em;margin-top:.8%}
.orn{width:42%;margin:1% auto 4%;color:var(--gold);display:flex;align-items:center;gap:10px}
.orn:before,.orn:after{content:"";height:1px;background:var(--gold);flex:1}
.menu{width:97%;margin:auto;display:grid;grid-template-columns:.92fr 1.08fr;gap:1.5%;align-items:start}
.panel{border:1px solid var(--line);border-radius:7px;padding:2.8% 3%;background:#fff;min-width:0}
.head{margin:-8% 0 4%;padding:4% 2%;border:2px solid var(--gold);border-radius:6px;background:var(--black);color:var(--gold2);text-align:center;font-size:clamp(9px,1.5vw,38px);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.item{padding:4% 0 4.6%;border-bottom:1px solid rgba(181,133,47,.25)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:start}
.name{font-size:clamp(10px,1.65vw,39px);line-height:1.05;font-weight:800;text-transform:uppercase;overflow-wrap:normal;word-break:normal}
.price{font-size:clamp(10px,1.55vw,37px);font-weight:800;white-space:nowrap;text-align:right}
.extracts .item{padding:3.3% 0 3.8%}
.extracts .name{font-size:clamp(9px,1.45vw,35px)}
.extracts .price{font-size:clamp(9px,1.4vw,34px)}
.right-stack{display:flex;flex-direction:column;gap:5%}
.cured{margin-top:2%}
.cured .item{padding:4.5% 0 5%}
.footer{position:absolute;left:9%;right:9%;bottom:2.5%;padding:1.3% 2%;background:var(--black);color:var(--gold2);border:2px solid var(--gold);border-radius:6px;text-align:center}
.footer strong{display:block;font-size:clamp(8px,1.25vw,31px);letter-spacing:.15em;text-transform:uppercase}
.footer small{display:block;margin-top:.4%;font-size:clamp(5px,.7vw,18px);letter-spacing:.1em;text-transform:uppercase}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold);text-transform:uppercase}
</style>
</head>

<body>
<main class="screen">
<div class="frame">

<header class="brand">
  <img src="cremers-logo.png" alt="Cremers">
  <div class="kicker">Coffeeshop · Since 1990</div>
  <h1>Premium Extracts <span>Cremers Selection</span></h1>
  <div class="orn">✦</div>
</header>

<div id="loading">Loading menu…</div>

<section id="menu" class="menu" hidden>

  <div class="panel wpff">
    <div class="head">WPFF</div>
    <div id="wpff"></div>
  </div>

  <div class="right-stack">
    <div class="panel extracts">
      <div class="head">Extracts</div>
      <div id="extracts"></div>
    </div>

    <div class="panel cured">
      <div class="head">Cured by Cremers</div>
      <div id="cured"></div>
    </div>
  </div>

</section>

<footer class="footer">
  <strong>Premium Extract Selection</strong>
  <small>Carefully selected · Premium quality · Cremers since 1990</small>
</footer>

</div>
</main>

<script>
const URL="https://script.google.com/macros/s/AKfycbx2tgVQp13EdurZ22_HAafU_DK_9EKnx6bQRdx8JLLBedQr9J7xQxkxICfOwsWgpVveYA/exec";

const safe=v=>String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

function euro(v){
  const raw=String(v??"").trim().replace("€","").replace(",",".");
  const n=Number(raw);

  return Number.isFinite(n)
    ? "€"+n.toLocaleString("nl-NL",{minimumFractionDigits:n%1===0?0:2,maximumFractionDigits:2})
    : safe(v);
}

function card(x){
  return `<article class="item">
    <div class="top">
      <div class="name">${safe(x.Product)}</div>
      <div class="price">${euro(x.Price)}</div>
    </div>
  </article>`;
}

function cremersMenuData(rows){
  const clean=rows.filter(x=>String(x.Product??"").trim()!=="");

  const wpff=clean.filter(x=>String(x.Category??"").trim().toLowerCase()==="wpff");
  const extracts=clean.filter(x=>String(x.Category??"").trim().toLowerCase()==="extracts");
  const cured=clean.filter(x=>String(x.Category??"").trim().toLowerCase()==="cured by cremers");

  document.getElementById("wpff").innerHTML=wpff.map(card).join("");
  document.getElementById("extracts").innerHTML=extracts.map(card).join("");
  document.getElementById("cured").innerHTML=cured.map(card).join("");

  document.getElementById("loading").hidden=true;
  document.getElementById("menu").hidden=false;

  localStorage.setItem("cremersExtractsCache",JSON.stringify(rows));
}

try{
  const cache=JSON.parse(localStorage.getItem("cremersExtractsCache"));
  if(cache) cremersMenuData(cache);
}catch(e){}

async function refresh(){
  try{
    const response=await fetch(
      URL+"?tab="+encodeURIComponent("Premium Extracts")+"&_="+Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok) throw new Error("HTTP "+response.status);

    const text=await response.text();
    let rows;

    try{
      rows=JSON.parse(text);
    }catch(e){
      const match=text.match(/^[^(]*\((.*)\)\s*;?\s*$/s);
      if(!match) throw new Error("Unexpected Apps Script response");
      rows=JSON.parse(match[1]);
    }

    if(!Array.isArray(rows)) throw new Error("Menu data is not an array");

    cremersMenuData(rows);

  }catch(error){
    console.error("Live menu update failed:",error);

    const loading=document.getElementById("loading");

    if(!document.getElementById("menu").hidden){
      loading.hidden=true;
    }else{
      loading.textContent="Menu data is taking longer than expected…";
    }
  }
}

refresh();
setInterval(refresh,60000);
</script>

</body>
</html>
