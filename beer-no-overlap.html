<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cremers Café - Beer Menu</title>

<style>
:root{
  --olive:#3F4937;
  --black:#111111;
  --line:#d9d9d4;
  --bg:#ffffff;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--black);
}

.menu{
  width:1080px;
  height:1920px;
  padding:48px 58px 38px;
  display:flex;
  flex-direction:column;
  background:#fff;
  transform-origin:top left;
}

/* HEADER */
.header{
  height:205px;
  position:relative;
  border-bottom:3px solid var(--olive);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 205px;
}

.logo-wrap{
  width:350px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.logo-wrap img{
  width:100%;
  max-height:120px;
  object-fit:contain;
  display:block;
}

.header-side{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  line-height:1.45;
  letter-spacing:4px;
  text-transform:uppercase;
}

.header-side.left{left:0;text-align:left;}
.header-side.right{right:0;text-align:right;}

/* TITLE */
.title-row{
  height:68px;
  flex:0 0 68px;
  display:flex;
  align-items:center;
}

.title{
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-size:38px;
  font-weight:700;
  letter-spacing:8px;
}

/* LIST */
.beer-list{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.beer-row{
  height:58px;
  flex:0 0 58px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:14px;
  padding:4px 0;
}

.tap{
  width:52px;
  flex:0 0 52px;
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  font-weight:700;
  line-height:1;
}

.main{
  flex:1 1 auto;
  min-width:0;
  height:48px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.name{
  font-size:26px;
  font-weight:700;
  line-height:26px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brewery{
  color:var(--olive);
  font-size:15px;
  line-height:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  width:235px;
  flex:0 0 235px;
  height:48px;
  display:grid;
  grid-template-columns:92px 1fr;
  grid-template-rows:26px 18px;
  column-gap:14px;
  align-items:center;
}

.amount{
  grid-column:1;
  grid-row:1;
  text-align:right;
  font-size:20px;
  line-height:24px;
  white-space:nowrap;
}

.alcohol{
  grid-column:1;
  grid-row:2;
  text-align:right;
  color:var(--olive);
  font-size:14px;
  line-height:17px;
  white-space:nowrap;
}

.price{
  grid-column:2;
  grid-row:1 / span 2;
  align-self:center;
  text-align:right;
  font-size:27px;
  font-weight:700;
  line-height:30px;
  white-space:nowrap;
}

/* FOOTER */
.footer{
  height:54px;
  flex:0 0 54px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-size:15px;
  letter-spacing:5px;
  text-transform:uppercase;
  white-space:nowrap;
}

.message{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--olive);
  font-size:30px;
}
</style>
</head>

<body>

<div class="menu" id="menu">

  <header class="header">

    <div class="header-side left">
      GOOD BEER<br>
      GOOD FOOD<br>
      GOOD COMPANY
    </div>

    <div class="logo-wrap">
      <img src="cremers-logo.png" alt="Cremers">
    </div>

    <div class="header-side right">
      DRINK<br>
      RELAX<br>
      ENJOY
    </div>

  </header>

  <div class="title-row">
    <div class="title">BEER</div>
  </div>

  <main class="beer-list" id="beerList"></main>

  <footer class="footer">
    GOOD BEER BRINGS PEOPLE TOGETHER
  </footer>

</div>

<script>
const DATA_URL =
"https://script.google.com/macros/s/AKfycbzM2ocIa74JX1Zu2WaAf-Gac_DRX7y6u4qzVO-w7b65hBehjAq8TcpzlJjyUc2RoUEq/exec?tab=Beer";

function formatPrice(value){
  if(value === "" || value === null || value === undefined) return "";

  const number =
    typeof value === "number"
      ? value
      : parseFloat(
          String(value)
          .replace(",", ".")
          .replace(/[^\d.-]/g, "")
        );

  if(isNaN(number)) return String(value);

  return "€ " + number.toFixed(2).replace(".", ",");
}

function formatAlcohol(value){
  if(value === "" || value === null || value === undefined) return "";

  const text = String(value).trim();

  return text.indexOf("%") !== -1 ? text : text + "%";
}

function createBeer(item){
  const row = document.createElement("div");
  row.className = "beer-row";

  const tap = document.createElement("div");
  tap.className = "tap";
  tap.textContent = item["Tap"] || "";

  const main = document.createElement("div");
  main.className = "main";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = item["Beer Name"] || "";

  const brewery = document.createElement("div");
  brewery.className = "brewery";
  brewery.textContent = item["Brewery"] || "";

  main.appendChild(name);
  main.appendChild(brewery);

  const meta = document.createElement("div");
  meta.className = "meta";

  const amount = document.createElement("div");
  amount.className = "amount";
  amount.textContent = item["Amount"] || "";

  const alcohol = document.createElement("div");
  alcohol.className = "alcohol";
  alcohol.textContent = formatAlcohol(item["Alcohol %"]);

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = formatPrice(item["Price"]);

  meta.appendChild(amount);
  meta.appendChild(alcohol);
  meta.appendChild(price);

  row.appendChild(tap);
  row.appendChild(main);
  row.appendChild(meta);

  return row;
}

async function loadMenu(){
  const list = document.getElementById("beerList");

  try{
    const response = await fetch(DATA_URL);

    if(!response.ok){
      throw new Error("Could not load menu");
    }

    const data = await response.json();

    const beers = data
      .filter(function(item){
        const available = item["Available"];
        const checked =
          available === true ||
          String(available).toLowerCase() === "true";

        return checked && item["Beer Name"];
      })
      .slice(0,25);

    list.innerHTML = "";

    if(beers.length === 0){
      list.innerHTML =
        '<div class="message">Beer menu coming soon</div>';
      return;
    }

    beers.forEach(function(item){
      list.appendChild(createBeer(item));
    });

  }catch(error){
    console.error(error);
    list.innerHTML =
      '<div class="message">Unable to load menu</div>';
  }
}

function scaleMenu(){
  const menu = document.getElementById("menu");

  const scale = Math.min(
    window.innerWidth / 1080,
    window.innerHeight / 1920
  );

  menu.style.transform = "scale(" + scale + ")";
}

scaleMenu();
window.addEventListener("resize", scaleMenu);

loadMenu();
setInterval(loadMenu,60000);
</script>

</body>
</html>
