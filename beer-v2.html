<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cremers Café - Beer Menu</title>
<style>
:root{--olive:#3F4937;--black:#111111;--line:#d8d8d3;--bg:#ffffff;}
*{box-sizing:border-box;}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:Arial,Helvetica,sans-serif;color:var(--black);}
.menu{width:100vw;height:100vh;padding:2.4vh 3.4vw 2.2vh;display:flex;flex-direction:column;background:var(--bg);}
.header{position:relative;height:15vh;min-height:122px;border-bottom:2px solid var(--olive);display:flex;align-items:center;justify-content:center;}
.logo-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:34vw;max-width:560px;min-width:360px;}
.logo-wrap img{width:100%;max-height:11.5vh;object-fit:contain;display:block;}
.header-side{position:absolute;top:50%;transform:translateY(-50%);color:var(--olive);font-family:Georgia,"Times New Roman",serif;font-size:clamp(14px,1.05vw,20px);line-height:1.4;letter-spacing:.26em;text-transform:uppercase;}
.header-side.left{left:0;text-align:left;}
.header-side.right{right:0;text-align:right;}
.title-row{height:6.2vh;min-height:50px;display:flex;align-items:center;}
.title{color:var(--olive);font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,2.1vw,42px);line-height:1;font-weight:700;letter-spacing:.20em;text-transform:uppercase;}
.beer-list{flex:1;min-height:0;display:flex;flex-direction:column;}
.beer-row{flex:0 0 auto;display:grid;grid-template-columns:70px minmax(0,1fr) 150px 170px;grid-template-rows:auto auto;column-gap:22px;border-bottom:1px solid var(--line);align-items:center;}
.tap{grid-column:1;grid-row:1 / span 2;color:var(--olive);font-family:Georgia,"Times New Roman",serif;font-weight:700;text-align:left;align-self:center;}
.name{grid-column:2;grid-row:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brewery{grid-column:2;grid-row:2;color:var(--olive);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.amount{grid-column:3;grid-row:1;text-align:right;white-space:nowrap;}
.alcohol{grid-column:3;grid-row:2;text-align:right;color:var(--olive);white-space:nowrap;}
.price{grid-column:4;grid-row:1 / span 2;align-self:center;text-align:right;font-weight:700;white-space:nowrap;}
.menu.size-large .beer-row{height:8.0vh;min-height:68px;padding:.6vh 0;}
.menu.size-large .tap{font-size:clamp(24px,1.8vw,35px);}
.menu.size-large .name{font-size:clamp(28px,2.15vw,42px);}
.menu.size-large .brewery{font-size:clamp(18px,1.25vw,25px);}
.menu.size-large .amount{font-size:clamp(23px,1.55vw,30px);}
.menu.size-large .alcohol{font-size:clamp(17px,1.15vw,23px);}
.menu.size-large .price{font-size:clamp(28px,2.1vw,41px);}
.menu.size-medium .beer-row{height:4.8vh;min-height:43px;padding:.2vh 0;}
.menu.size-medium .tap{font-size:clamp(18px,1.2vw,24px);}
.menu.size-medium .name{font-size:clamp(21px,1.45vw,29px);}
.menu.size-medium .brewery{font-size:clamp(14px,.95vw,19px);}
.menu.size-medium .amount{font-size:clamp(18px,1.15vw,23px);}
.menu.size-medium .alcohol{font-size:clamp(13px,.85vw,17px);}
.menu.size-medium .price{font-size:clamp(22px,1.5vw,30px);}
.menu.size-compact .beer-row{height:3.15vh;min-height:30px;padding:0;}
.menu.size-compact .tap{font-size:clamp(15px,.95vw,19px);}
.menu.size-compact .name{font-size:clamp(17px,1.12vw,22px);}
.menu.size-compact .brewery{font-size:clamp(11px,.72vw,14px);}
.menu.size-compact .amount{font-size:clamp(14px,.88vw,18px);}
.menu.size-compact .alcohol{font-size:clamp(10px,.66vw,13px);}
.menu.size-compact .price{font-size:clamp(18px,1.16vw,23px);}
.footer{height:4.2vh;min-height:34px;display:flex;align-items:flex-end;justify-content:center;color:var(--olive);font-family:Georgia,"Times New Roman",serif;font-size:clamp(12px,.8vw,16px);letter-spacing:.34em;text-transform:uppercase;white-space:nowrap;}
.message{flex:1;display:flex;align-items:center;justify-content:center;color:var(--olive);font-size:clamp(28px,2vw,40px);}
@media (max-width:1400px){
  .beer-row{grid-template-columns:56px minmax(0,1fr) 115px 135px;column-gap:16px;}
  .logo-wrap{width:31vw;min-width:280px;}
}
</style>
</head>
<body>
<div class="menu size-large" id="menu">
  <header class="header">
    <div class="header-side left">GOOD BEER<br>GOOD FOOD<br>GOOD COMPANY</div>
    <div class="logo-wrap"><img src="cremers-logo.png" alt="Cremers"></div>
    <div class="header-side right">DRINK<br>RELAX<br>ENJOY</div>
  </header>

  <div class="title-row"><div class="title">BEER</div></div>

  <main class="beer-list" id="beerList"></main>

  <footer class="footer">GOOD BEER BRINGS PEOPLE TOGETHER</footer>
</div>

<script>
const DATA_URL =
"https://script.google.com/macros/s/AKfycbzM2ocIa74JX1Zu2WaAf-Gac_DRX7y6u4qzVO-w7b65hBehjAq8TcpzlJjyUc2RoUEq/exec?tab=Beer";

function formatPrice(value){
  if(value === "" || value === null || value === undefined) return "";
  const number =
    typeof value === "number"
      ? value
      : parseFloat(String(value).replace(",", ".").replace(/[^\d.-]/g, ""));
  if(isNaN(number)) return String(value);
  return "€ " + number.toFixed(2).replace(".", ",");
}

function formatAlcohol(value){
  if(value === "" || value === null || value === undefined) return "";
  const text = String(value).trim();
  return text.includes("%") ? text : text + "%";
}

function createBeer(item){
  const row = document.createElement("div");
  row.className = "beer-row";

  const tap = document.createElement("div");
  tap.className = "tap";
  tap.textContent = item["Tap"] ?? "";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = item["Beer Name"] || "";

  const brewery = document.createElement("div");
  brewery.className = "brewery";
  brewery.textContent = item["Brewery"] || "";

  const amount = document.createElement("div");
  amount.className = "amount";
  amount.textContent = item["Amount"] || "";

  const alcohol = document.createElement("div");
  alcohol.className = "alcohol";
  alcohol.textContent = formatAlcohol(item["Alcohol %"]);

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = formatPrice(item["Price"]);

  row.appendChild(tap);
  row.appendChild(name);
  row.appendChild(brewery);
  row.appendChild(amount);
  row.appendChild(alcohol);
  row.appendChild(price);
  return row;
}

function setDensity(count){
  const menu = document.getElementById("menu");
  menu.classList.remove("size-large","size-medium","size-compact");
  if(count <= 12){
    menu.classList.add("size-large");
  }else if(count <= 18){
    menu.classList.add("size-medium");
  }else{
    menu.classList.add("size-compact");
  }
}

async function loadMenu(){
  const list = document.getElementById("beerList");

  try{
    const response = await fetch(DATA_URL + "&t=" + Date.now());
    if(!response.ok) throw new Error("Could not load menu");

    const data = await response.json();

    const beers = data
      .filter(item => {
        const available = item["Available"];
        const checked =
          available === true ||
          String(available).toLowerCase() === "true";
        return checked && item["Beer Name"];
      })
      .slice(0,25);

    list.innerHTML = "";
    setDensity(beers.length);

    if(beers.length === 0){
      list.innerHTML = '<div class="message">Beer menu coming soon</div>';
      return;
    }

    beers.forEach(item => list.appendChild(createBeer(item)));

  }catch(error){
    console.error(error);
    list.innerHTML = '<div class="message">Unable to load menu</div>';
  }
}

loadMenu();
setInterval(loadMenu,60000);
</script>
</body>
</html>
