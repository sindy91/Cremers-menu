<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cremers Café - Beer Menu</title>

<style>
:root{
  --olive:#3F4937;
  --black:#111111;
  --line:#D9D9D4;
  --bg:#FFFFFF;
}

*{ box-sizing:border-box; }

html, body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
}

body{
  font-family:Arial, Helvetica, sans-serif;
  color:var(--black);
}

#menu{
  width:1080px;
  height:1920px;
  padding:30px 54px 26px;
  background:#fff;
  display:flex;
  flex-direction:column;
  transform-origin:top left;
}

/* ---------- HEADER ---------- */

.header{
  height:180px;
  flex:0 0 180px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:3px solid var(--olive);
}

.logo-wrap{
  width:360px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-wrap img{
  display:block;
  width:100%;
  max-height:118px;
  object-fit:contain;
}

.header-side{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color:var(--olive);
  font-family:Georgia, "Times New Roman", serif;
  font-size:19px;
  line-height:1.42;
  letter-spacing:4px;
  text-transform:uppercase;
}

.header-side.left{
  left:0;
  text-align:left;
}

.header-side.right{
  right:0;
  text-align:right;
}

/* ---------- TITLE ---------- */

.title-row{
  height:64px;
  flex:0 0 64px;
  display:flex;
  align-items:center;
}

.title{
  color:var(--olive);
  font-family:Georgia, "Times New Roman", serif;
  font-size:40px;
  line-height:1;
  font-weight:700;
  letter-spacing:8px;
}

/* ---------- BEER LIST ---------- */

#beerList{
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}

.beer-row{
  height:60px;
  width:100%;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--line);
}

.tap{
  width:54px;
  flex:0 0 54px;
  color:var(--olive);
  font-family:Georgia, "Times New Roman", serif;
  font-size:28px;
  font-weight:700;
  line-height:1;
}

.beer-text{
  flex:1 1 auto;
  min-width:0;
  height:50px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.beer-name{
  display:block;
  font-size:34px;
  font-weight:700;
  line-height:30px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brewery{
  display:block;
  margin-top:2px;
  color:var(--olive);
  font-size:18px;
  line-height:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.details{
  width:330px;
  flex:0 0 330px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
}

.size-abv{
  width:125px;
  flex:0 0 125px;
  height:48px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:right;
}

.amount{
  display:block;
  font-size:25px;
  line-height:25px;
  white-space:nowrap;
}

.alcohol{
  display:block;
  margin-top:3px;
  color:var(--olive);
  font-size:18px;
  line-height:18px;
  white-space:nowrap;
}

.price{
  width:175px;
  flex:0 0 175px;
  margin-left:30px;
  text-align:right;
  font-size:36px;
  line-height:40px;
  font-weight:700;
  white-space:nowrap;
}

/* ---------- FOOTER ---------- */

.footer{
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:var(--olive);
  font-family:Georgia, "Times New Roman", serif;
  font-size:15px;
  letter-spacing:5px;
  text-transform:uppercase;
  white-space:nowrap;
}

.message{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--olive);
  font-size:30px;
}
</style>
</head>

<body>

<div id="menu">

  <header class="header">
    <div class="header-side left">
      GOOD BEER<br>
      GOOD FOOD<br>
      GOOD COMPANY
    </div>

    <div class="logo-wrap">
      <img src="cremers-logo.png" alt="Cremers">
    </div>

    <div class="header-side right">
      DRINK<br>
      RELAX<br>
      ENJOY
    </div>
  </header>

  <div class="title-row">
    <div class="title">BEER</div>
  </div>

  <main id="beerList"></main>

  <footer class="footer">
    GOOD BEER BRINGS PEOPLE TOGETHER
  </footer>

</div>

<script>
var DATA_URL =
"https://script.google.com/macros/s/AKfycbzM2ocIa74JX1Zu2WaAf-Gac_DRX7y6u4qzVO-w7b65hBehjAq8TcpzlJjyUc2RoUEq/exec?tab=Beer";

function formatPrice(value){
  if(value === "" || value === null || value === undefined) return "";

  var number;

  if(typeof value === "number"){
    number = value;
  } else {
    number = parseFloat(
      String(value)
        .replace(",", ".")
        .replace(/[^\d.-]/g, "")
    );
  }

  if(isNaN(number)) return String(value);

  return "€ " + number.toFixed(2).replace(".", ",");
}

function formatAlcohol(value){
  if(value === "" || value === null || value === undefined) return "";

  var text = String(value).trim();

  if(text.indexOf("%") !== -1) return text;

  return text + "%";
}

function makeDiv(className, text){
  var el = document.createElement("div");
  el.className = className;
  el.textContent = text || "";
  return el;
}

function createBeer(item){
  var row = document.createElement("div");
  row.className = "beer-row";

  var tap = makeDiv("tap", item["Tap"]);

  var beerText = document.createElement("div");
  beerText.className = "beer-text";

  var name = makeDiv("beer-name", item["Beer Name"]);
  var brewery = makeDiv("brewery", item["Brewery"]);

  beerText.appendChild(name);
  beerText.appendChild(brewery);

  var details = document.createElement("div");
  details.className = "details";

  var sizeAbv = document.createElement("div");
  sizeAbv.className = "size-abv";

  var amount = makeDiv("amount", item["Amount"]);
  var alcohol = makeDiv("alcohol", formatAlcohol(item["Alcohol %"]));

  sizeAbv.appendChild(amount);
  sizeAbv.appendChild(alcohol);

  var price = makeDiv("price", formatPrice(item["Price"]));

  details.appendChild(sizeAbv);
  details.appendChild(price);

  row.appendChild(tap);
  row.appendChild(beerText);
  row.appendChild(details);

  return row;
}

function loadMenu(){
  var list = document.getElementById("beerList");

  fetch(DATA_URL)
    .then(function(response){
      if(!response.ok) throw new Error("Could not load menu");
      return response.json();
    })
    .then(function(data){
      var beers = data.filter(function(item){
        var available = item["Available"];
        var checked =
          available === true ||
          String(available).toLowerCase() === "true";

        return checked && item["Beer Name"];
      }).slice(0,25);

      list.innerHTML = "";

      if(beers.length === 0){
        list.innerHTML =
          '<div class="message">Beer menu coming soon</div>';
        return;
      }

      beers.forEach(function(item){
        list.appendChild(createBeer(item));
      });
    })
    .catch(function(error){
      console.log(error);
      list.innerHTML =
        '<div class="message">Unable to load menu</div>';
    });
}

function scaleMenu(){
  var menu = document.getElementById("menu");

  var scale = Math.min(
    window.innerWidth / 1080,
    window.innerHeight / 1920
  );

  menu.style.transform = "scale(" + scale + ")";
}

scaleMenu();
window.addEventListener("resize", scaleMenu);

loadMenu();
setInterval(loadMenu, 60000);
</script>

</body>
</html>
