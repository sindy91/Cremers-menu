<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cremers Café - Beer Menu</title>

<style>
:root{
  --olive:#3F4937;
  --black:#111111;
  --line:#d8d8d3;
  --bg:#ffffff;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--black);
}

.menu{
  width:100vw;
  height:100vh;
  padding:2.2vh 3.2vw 1.8vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* HEADER */

.header{
  position:relative;
  height:13vh;
  min-height:108px;
  border-bottom:2px solid var(--olive);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-wrap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:33vw;
  max-width:540px;
  min-width:340px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-wrap img{
  width:100%;
  max-height:10vh;
  object-fit:contain;
  display:block;
}

.header-side{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(15px,1.05vw,20px);
  line-height:1.35;
  letter-spacing:.24em;
  text-transform:uppercase;
}

.header-side.left{left:0;text-align:left;}
.header-side.right{right:0;text-align:right;}

/* TITLE */

.title-row{
  height:5.3vh;
  min-height:44px;
  display:flex;
  align-items:center;
}

.title{
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(31px,2.15vw,44px);
  line-height:1;
  font-weight:700;
  letter-spacing:.19em;
  text-transform:uppercase;
}

/* LIST */

.beer-list{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.beer-row{
  height:3.05vh;
  min-height:29px;
  max-height:34px;
  display:grid;
  grid-template-columns:64px minmax(0,1fr) 150px 175px;
  grid-template-rows:1fr 1fr;
  column-gap:20px;
  border-bottom:1px solid var(--line);
  align-items:center;
  padding:1px 0;
}

.tap{
  grid-column:1;
  grid-row:1 / span 2;
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-weight:700;
  font-size:clamp(20px,1.25vw,25px);
  line-height:1;
  align-self:center;
}

.name{
  grid-column:2;
  grid-row:1;
  font-size:clamp(23px,1.55vw,31px);
  line-height:1;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  align-self:end;
}

.brewery{
  grid-column:2;
  grid-row:2;
  color:var(--olive);
  font-size:clamp(15px,.95vw,19px);
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  align-self:start;
}

.amount{
  grid-column:3;
  grid-row:1;
  font-size:clamp(19px,1.2vw,24px);
  line-height:1;
  text-align:right;
  white-space:nowrap;
  align-self:end;
}

.alcohol{
  grid-column:3;
  grid-row:2;
  color:var(--olive);
  font-size:clamp(14px,.88vw,18px);
  line-height:1;
  text-align:right;
  white-space:nowrap;
  align-self:start;
}

.price{
  grid-column:4;
  grid-row:1 / span 2;
  align-self:center;
  text-align:right;
  font-size:clamp(25px,1.7vw,34px);
  line-height:1;
  font-weight:700;
  white-space:nowrap;
}

/* FOOTER */

.footer{
  height:3.8vh;
  min-height:30px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:var(--olive);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(12px,.8vw,16px);
  letter-spacing:.32em;
  text-transform:uppercase;
  white-space:nowrap;
}

.message{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--olive);
  font-size:clamp(28px,2vw,40px);
}

@media (max-width:1400px){
  .beer-row{
    grid-template-columns:52px minmax(0,1fr) 112px 132px;
    column-gap:14px;
  }

  .logo-wrap{
    width:30vw;
    min-width:280px;
  }
}
</style>
</head>

<body>

<div class="menu" id="menu">

  <header class="header">
    <div class="header-side left">
      GOOD BEER<br>
      GOOD FOOD<br>
      GOOD COMPANY
    </div>

    <div class="logo-wrap">
      <img src="cremers-logo.png" alt="Cremers">
    </div>

    <div class="header-side right">
      DRINK<br>
      RELAX<br>
      ENJOY
    </div>
  </header>

  <div class="title-row">
    <div class="title">BEER</div>
  </div>

  <main class="beer-list" id="beerList"></main>

  <footer class="footer">
    GOOD BEER BRINGS PEOPLE TOGETHER
  </footer>

</div>

<script>
const DATA_URL =
"https://script.google.com/macros/s/AKfycbzM2ocIa74JX1Zu2WaAf-Gac_DRX7y6u4qzVO-w7b65hBehjAq8TcpzlJjyUc2RoUEq/exec?tab=Beer";

function formatPrice(value){
  if(value === "" || value === null || value === undefined) return "";

  const number =
    typeof value === "number"
      ? value
      : parseFloat(
          String(value)
          .replace(",", ".")
          .replace(/[^\d.-]/g, "")
        );

  if(isNaN(number)) return String(value);

  return "€ " + number.toFixed(2).replace(".", ",");
}

function formatAlcohol(value){
  if(value === "" || value === null || value === undefined) return "";

  const text = String(value).trim();

  if(text.indexOf("%") !== -1) return text;

  return text + "%";
}

function createBeer(item){
  const row = document.createElement("div");
  row.className = "beer-row";

  const tap = document.createElement("div");
  tap.className = "tap";
  tap.textContent = item["Tap"] || "";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = item["Beer Name"] || "";

  const brewery = document.createElement("div");
  brewery.className = "brewery";
  brewery.textContent = item["Brewery"] || "";

  const amount = document.createElement("div");
  amount.className = "amount";
  amount.textContent = item["Amount"] || "";

  const alcohol = document.createElement("div");
  alcohol.className = "alcohol";
  alcohol.textContent = formatAlcohol(item["Alcohol %"]);

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = formatPrice(item["Price"]);

  row.appendChild(tap);
  row.appendChild(name);
  row.appendChild(brewery);
  row.appendChild(amount);
  row.appendChild(alcohol);
  row.appendChild(price);

  return row;
}

async function loadMenu(){
  const list = document.getElementById("beerList");

  try{
    const response = await fetch(DATA_URL);

    if(!response.ok){
      throw new Error("Could not load menu");
    }

    const data = await response.json();

    const beers = data
      .filter(function(item){
        const available = item["Available"];

        const checked =
          available === true ||
          String(available).toLowerCase() === "true";

        return checked && item["Beer Name"];
      })
      .slice(0,25);

    list.innerHTML = "";

    if(beers.length === 0){
      list.innerHTML =
        '<div class="message">Beer menu coming soon</div>';
      return;
    }

    beers.forEach(function(item){
      list.appendChild(createBeer(item));
    });

  } catch(error){
    console.error(error);

    list.innerHTML =
      '<div class="message">Unable to load menu</div>';
  }
}

loadMenu();
setInterval(loadMenu,60000);
</script>

</body>
</html>
