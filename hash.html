<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Cremers — Hash & Premium Extracts</title>

<style>
:root{
  --gold:#b5852f;
  --gold2:#d8b46d;
  --line:#dfcfaa;
  --black:#111;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#fff!important;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}
body{overflow-x:hidden}
.screen{
  position:relative;
  width:min(100vw,56.25vh);
  height:min(177.7778vw,100vh);
  margin:auto;
  background:#fff;
  overflow:hidden;
}
@media(max-aspect-ratio:9/16){
  .screen{width:100vw;height:177.7778vw}
}
.frame{
  position:absolute;
  inset:1.2%;
  border:1px solid var(--gold);
  padding:2.1% 2.8%;
}
.brand{text-align:center}
.brand img{
  width:36%;
  max-height:8.2%;
  object-fit:contain;
}
.kicker{
  font-size:clamp(8px,1.05vw,28px);
  letter-spacing:.28em;
  text-transform:uppercase;
}
h1{
  margin:1% 0 0;
  font:500 clamp(32px,5.2vw,116px)/.92 Georgia,serif;
  text-transform:uppercase;
}
h1 span{
  display:block;
  color:var(--gold);
  font-size:61%;
  letter-spacing:.15em;
  margin-top:.7%;
}
.orn{
  width:42%;
  margin:1% auto 3.5%;
  color:var(--gold);
  display:flex;
  align-items:center;
  gap:10px;
}
.orn:before,.orn:after{
  content:"";
  height:1px;
  background:var(--gold);
  flex:1;
}

.layout{
  display:grid;
  grid-template-columns:1.42fr .78fr;
  gap:1.6%;
  width:98%;
  margin:auto;
  align-items:start;
}

.panel{
  border:1px solid var(--line);
  border-radius:7px;
  padding:2.8% 3%;
  background:#fff;
  min-width:0;
}

.head{
  margin:-6.5% 0 3.5%;
  padding:3.7% 2%;
  background:var(--black);
  color:var(--gold2);
  border:2px solid var(--gold);
  border-radius:6px;
  text-align:center;
  font-size:clamp(11px,1.6vw,40px);
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.hash-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 4%;
}

.hash-item{
  padding:5.0% 0 5.5%;
  border-bottom:1px solid rgba(181,133,47,.28);
}

.hash-top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:6px;
  align-items:baseline;
}

.hash-name{
  font-size:clamp(13px,1.82vw,44px);
  line-height:1.04;
  font-weight:800;
  text-transform:uppercase;
  overflow-wrap:normal;
}

.hash-price{
  font-size:clamp(13px,1.70vw,41px);
  font-weight:800;
  white-space:nowrap;
}

.hash-farm{
  margin-top:2%;
  color:var(--gold);
  font-size:clamp(8px,1.03vw,25px);
  font-weight:700;
  text-transform:uppercase;
}

.hash-meta{
  margin-top:1.8%;
  font-size:clamp(8px,1.00vw,24px);
  line-height:1.18;
  font-weight:800;
  text-transform:uppercase;
}

.hash-meta .type{
  color:#111;
}

.hash-meta .dot{
  color:var(--gold);
  margin:0 .25em;
}

.deal{
  display:inline-block;
  margin-top:2.2%;
  padding:2px 5px;
  background:var(--gold);
  color:#fff;
  border-radius:3px;
  font-size:clamp(7px,.92vw,22px);
  font-weight:800;
  text-transform:uppercase;
  white-space:nowrap;
}

/* EXTRACTS */

.extract-stack{
  display:flex;
  flex-direction:column;
  gap:5%;
}

.extract-section{
  border:1px solid var(--line);
  border-radius:7px;
  padding:3.5% 4%;
  background:#fff;
}

.extract-head{
  margin:-8% 0 4%;
  padding:4% 2%;
  background:var(--black);
  color:var(--gold2);
  border:2px solid var(--gold);
  border-radius:6px;
  text-align:center;
  font-size:clamp(10px,1.42vw,34px);
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.extract-item{
  padding:4.2% 0 4.7%;
  border-bottom:1px solid rgba(181,133,47,.28);
}

.extract-top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:6px;
  align-items:baseline;
}

.extract-name{
  font-size:clamp(10px,1.42vw,34px);
  line-height:1.04;
  font-weight:800;
  text-transform:uppercase;
}

.extract-price{
  font-size:clamp(10px,1.35vw,32px);
  font-weight:800;
  white-space:nowrap;
}

.footer{
  position:absolute;
  left:9%;
  right:9%;
  bottom:1.1%;
  padding:1.05% 2%;
  background:var(--black);
  color:var(--gold2);
  border:2px solid var(--gold);
  border-radius:6px;
  text-align:center;
}

.footer strong{
  display:block;
  font-size:clamp(9px,1.18vw,29px);
  letter-spacing:.14em;
  text-transform:uppercase;
}

.footer small{
  display:block;
  margin-top:.25%;
  font-size:clamp(6px,.68vw,17px);
  letter-spacing:.1em;
  text-transform:uppercase;
}

#loading{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:var(--gold);
  text-transform:uppercase;
}
</style>
</head>

<body>
<main class="screen">
<div class="frame">

<header class="brand">
  <img src="cremers-logo.png" alt="Cremers">
  <div class="kicker">Coffeeshop · Since 1990</div>
  <h1>Hash <span>& Premium Extracts</span></h1>
  <div class="orn">✦</div>
</header>

<div id="loading">Loading menu…</div>

<section id="menu" class="layout" hidden>

  <div class="panel">
    <div class="head">Premium Hash Selection</div>
    <div id="hashGrid" class="hash-grid"></div>
  </div>

  <div class="extract-stack">
    <div class="extract-section">
      <div class="extract-head">WPFF</div>
      <div id="wpff"></div>
    </div>

    <div class="extract-section">
      <div class="extract-head">Extracts</div>
      <div id="extracts"></div>
    </div>

    <div class="extract-section">
      <div class="extract-head">Cured by Cremers</div>
      <div id="cured"></div>
    </div>
  </div>

</section>

<footer class="footer">
  <strong>Premium Hash & Extracts</strong>
  <small>Carefully selected · Quality first · Cremers since 1990</small>
</footer>

</div>
</main>

<script>
const BASE =
"https://script.google.com/macros/s/AKfycbx2tgVQp13EdurZ22_HAafU_DK_9EKnx6bQRdx8JLLBedQr9J7xQxkxICfOwsWgpVveYA/exec";

const safe=v=>String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

function euro(v){
  const raw=String(v??"")
    .trim()
    .replace("€","")
    .replace(/\./g,"")
    .replace(",",".");
  const n=Number(raw);

  return Number.isFinite(n)
    ? "€"+n.toLocaleString("nl-NL",{
        minimumFractionDigits:n%1===0?0:2,
        maximumFractionDigits:2
      })
    : safe(v);
}

function hashMeta(x){
  const parts=[];

  const type=String(x.Type??"").trim();
  const indica=String(x["Indica %"]??"").trim();
  const sativa=String(x["Sativa %"]??"").trim();

  if(type){
    parts.push(`<span class="type">${safe(type)}</span>`);
  }

  if(indica){
    parts.push(`<span>${safe(indica)}% Indica</span>`);
  }

  if(sativa){
    parts.push(`<span>${safe(sativa)}% Sativa</span>`);
  }

  if(!parts.length) return "";

  return `<div class="hash-meta">${parts.join('<span class="dot">·</span>')}</div>`;
}

function hashCard(x){
  return `
    <article class="hash-item">
      <div class="hash-top">
        <div class="hash-name">${safe(x.Strain)}</div>
        <div class="hash-price">${euro(x.Price)}</div>
      </div>

      ${x.Farm ? `<div class="hash-farm">${safe(x.Farm)}</div>` : ""}

      ${hashMeta(x)}

      ${x.Deal ? `<span class="deal">${safe(x.Deal)}</span>` : ""}
    </article>
  `;
}

function extractCard(x){
  return `
    <article class="extract-item">
      <div class="extract-top">
        <div class="extract-name">${safe(x.Product)}</div>
        <div class="extract-price">${euro(x.Price)}</div>
      </div>
    </article>
  `;
}

async function getTab(tab){
  const response=await fetch(
    BASE+"?tab="+encodeURIComponent(tab)+"&_="+Date.now(),
    {cache:"no-store"}
  );

  if(!response.ok){
    throw new Error("HTTP "+response.status+" for "+tab);
  }

  const text=await response.text();
  let data;

  try{
    data=JSON.parse(text);
  }catch(e){
    const match=text.match(/^[^(]*\((.*)\)\s*;?\s*$/s);
    if(!match){
      throw new Error("Unexpected Apps Script response for "+tab);
    }
    data=JSON.parse(match[1]);
  }

  if(data && data.error){
    throw new Error(data.error+" "+(data.requestedTab||""));
  }

  if(!Array.isArray(data)){
    throw new Error(tab+" data is not an array");
  }

  return data;
}

function render(hashRows, extractRows){
  const hash=hashRows.filter(x=>String(x.Strain??"").trim()!=="");

  document.getElementById("hashGrid").innerHTML=
    hash.map(hashCard).join("");

  const clean=extractRows.filter(x=>String(x.Product??"").trim()!=="");

  const wpff=clean.filter(
    x=>String(x.Category??"").trim().toLowerCase()==="wpff"
  );

  const extracts=clean.filter(
    x=>String(x.Category??"").trim().toLowerCase()==="extracts"
  );

  const cured=clean.filter(
    x=>String(x.Category??"").trim().toLowerCase()==="cured by cremers"
  );

  document.getElementById("wpff").innerHTML=
    wpff.map(extractCard).join("");

  document.getElementById("extracts").innerHTML=
    extracts.map(extractCard).join("");

  document.getElementById("cured").innerHTML=
    cured.map(extractCard).join("");

  document.getElementById("loading").hidden=true;
  document.getElementById("menu").hidden=false;

  localStorage.setItem("cremersHashCache",JSON.stringify(hashRows));
  localStorage.setItem("cremersExtractCache",JSON.stringify(extractRows));
}

try{
  const hashCache=JSON.parse(localStorage.getItem("cremersHashCache"));
  const extractCache=JSON.parse(localStorage.getItem("cremersExtractCache"));

  if(hashCache && extractCache){
    render(hashCache,extractCache);
  }
}catch(e){}

async function refresh(){
  try{
    const [hashRows,extractRows]=await Promise.all([
      getTab("Hash"),
      getTab("Premium Extracts")
    ]);

    render(hashRows,extractRows);

  }catch(error){
    console.error("Live menu update failed:",error);

    const loading=document.getElementById("loading");

    if(!document.getElementById("menu").hidden){
      loading.hidden=true;
    }else{
      loading.textContent="Menu data is taking longer than expected…";
    }
  }
}

refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
