<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cremers Café - Food Menu</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111111;
}

.menu {
    width: 1080px;
    height: 1920px;
    padding: 56px 62px 50px;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    transform-origin: top left;
}

/* HEADER */

.header {
    height: 250px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-bottom: 3px solid #3F4937;
    padding-bottom: 30px;
}

.header-side {
    color: #3F4937;
    text-transform: uppercase;
    letter-spacing: 5px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.55;
}

.header-side.right {
    text-align: right;
}

.logo-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo-wrap img {
    width: 310px;
    max-height: 150px;
    object-fit: contain;
}

/* SECTION */

.section {
    margin-top: 28px;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 18px;
    color: #3F4937;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 14px;
}

.section-title::after {
    content: "";
    flex: 1;
    height: 2px;
    background: #3F4937;
    opacity: 0.75;
}

/* ITEMS */

.items {
    display: flex;
    flex-direction: column;
}

.food-item {
    min-height: 94px;
    padding: 14px 0 13px;
    border-bottom: 1px solid #d8d8d3;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto auto;
    column-gap: 20px;
}

.food-name {
    grid-column: 1;
    grid-row: 1;
    font-size: 31px;
    font-weight: 700;
    line-height: 1.15;
}

.food-price {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: center;
    text-align: right;
    font-size: 33px;
    font-weight: 700;
    white-space: nowrap;
}

.food-amount {
    grid-column: 1;
    grid-row: 2;
    color: #3F4937;
    font-size: 22px;
    line-height: 1.25;
    margin-top: 5px;
}

.food-amount:empty {
    display: none;
}

.footer {
    margin-top: auto;
    padding-top: 26px;
    text-align: center;
    color: #3F4937;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    letter-spacing: 7px;
    text-transform: uppercase;
}

.message {
    text-align: center;
    color: #3F4937;
    font-size: 30px;
    padding: 60px 0;
}

/* Dynamic compacting if there are many items */

.menu.compact .food-item {
    min-height: 78px;
    padding: 10px 0 9px;
}

.menu.compact .food-name {
    font-size: 27px;
}

.menu.compact .food-price {
    font-size: 29px;
}

.menu.compact .food-amount {
    font-size: 19px;
}

.menu.very-compact .food-item {
    min-height: 66px;
    padding: 7px 0 6px;
}

.menu.very-compact .food-name {
    font-size: 24px;
}

.menu.very-compact .food-price {
    font-size: 26px;
}

.menu.very-compact .food-amount {
    font-size: 17px;
}

.menu.very-compact .section-title {
    font-size: 36px;
    margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="menu" id="menu">

    <header class="header">
        <div class="header-side">
            GOOD FOOD<br>
            GOOD DRINKS<br>
            GOOD COMPANY
        </div>

        <div class="logo-wrap">
            <img src="cremers-logo.png" alt="Cremers">
        </div>

        <div class="header-side right">
            EAT<br>
            RELAX<br>
            ENJOY
        </div>
    </header>

    <section class="section" id="savorySection">
        <div class="section-title">SAVORY</div>
        <div class="items" id="savoryItems"></div>
    </section>

    <section class="section" id="sweetSection">
        <div class="section-title">SWEET</div>
        <div class="items" id="sweetItems"></div>
    </section>

    <footer class="footer">
        GOOD FOOD BRINGS PEOPLE TOGETHER
    </footer>

</div>

<script>
const DATA_URL =
"https://script.google.com/macros/s/AKfycbzM2ocIa74JX1Zu2WaAf-Gac_DRX7y6u4qzVO-w7b65hBehjAq8TcpzlJjyUc2RoUEq/exec?tab=Food";

function formatPrice(value) {
    if (value === "" || value === null || value === undefined) return "";

    const number =
        typeof value === "number"
        ? value
        : parseFloat(
            String(value)
            .replace(",", ".")
            .replace(/[^\d.-]/g, "")
        );

    if (isNaN(number)) return value;

    return "€ " + number.toFixed(2).replace(".", ",");
}

function createFoodItem(item) {
    const wrap = document.createElement("div");
    wrap.className = "food-item";

    const name = document.createElement("div");
    name.className = "food-name";
    name.textContent = item["Food Name"] || "";

    const price = document.createElement("div");
    price.className = "food-price";
    price.textContent = formatPrice(item["Price"]);

    const amount = document.createElement("div");
    amount.className = "food-amount";
    amount.textContent = item["Amount"] || "";

    wrap.appendChild(name);
    wrap.appendChild(price);
    wrap.appendChild(amount);

    return wrap;
}

async function loadMenu() {
    const savoryItems = document.getElementById("savoryItems");
    const sweetItems = document.getElementById("sweetItems");
    const savorySection = document.getElementById("savorySection");
    const sweetSection = document.getElementById("sweetSection");
    const menu = document.getElementById("menu");

    savoryItems.innerHTML = "";
    sweetItems.innerHTML = "";

    try {
        const response = await fetch(DATA_URL + "&t=" + Date.now());
        if (!response.ok) throw new Error("Could not load menu");

        const data = await response.json();

        const items = data
            .filter(item => {
                const available = item["Available"];
                const checked =
                    available === true ||
                    String(available).toLowerCase() === "true";

                return checked && item["Food Name"];
            })
            .slice(0, 25);

        const savory = items.filter(item =>
            String(item["Category"] || "").trim().toLowerCase() === "savory"
        );

        const sweet = items.filter(item =>
            String(item["Category"] || "").trim().toLowerCase() === "sweet"
        );

        savory.forEach(item =>
            savoryItems.appendChild(createFoodItem(item))
        );

        sweet.forEach(item =>
            sweetItems.appendChild(createFoodItem(item))
        );

        savorySection.style.display = savory.length ? "block" : "none";
        sweetSection.style.display = sweet.length ? "block" : "none";

        if (items.length === 0) {
            savorySection.style.display = "block";
            savorySection.innerHTML =
                '<div class="message">Food menu coming soon</div>';
            sweetSection.style.display = "none";
        }

        menu.classList.remove("compact", "very-compact");

        if (items.length > 16) {
            menu.classList.add("compact");
        }

        if (items.length > 21) {
            menu.classList.remove("compact");
            menu.classList.add("very-compact");
        }

    } catch (error) {
        console.error(error);

        savorySection.style.display = "block";
        savorySection.innerHTML =
            '<div class="message">Unable to load menu</div>';
        sweetSection.style.display = "none";
    }
}

function scaleMenu() {
    const menu = document.getElementById("menu");
    const scale = Math.min(
        window.innerWidth / 1080,
        window.innerHeight / 1920
    );

    menu.style.transform = `scale(${scale})`;
}

scaleMenu();
window.addEventListener("resize", scaleMenu);

loadMenu();
setInterval(loadMenu, 60000);
</script>

</body>
</html>
