<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Café Cremers Food</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:#171914;font-family:Arial,sans-serif}body{overflow:hidden}.screen{position:absolute;left:0;top:100%;width:100vh;height:100vw;transform:rotate(-90deg);transform-origin:top left;padding:2.2vh 4vw 1.7vh;display:flex;flex-direction:column}header{height:12vh;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;border-bottom:3px solid #4d5a32;padding-bottom:1vh}.tag{color:#4d5a32;font-weight:800;font-size:clamp(13px,1.25vw,25px);line-height:1.35;letter-spacing:.12em}.right{text-align:right}.logo-wrap{text-align:center}.logo{max-width:92%;max-height:8.5vh;object-fit:contain}main{flex:1;min-height:0;padding-top:1.4vh;overflow:hidden}#menu{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:0 3.2vw;align-content:start}.column+ .column{border-left:1px solid #4d5a32;padding-left:2.2vw}.column{min-width:0}.category{margin:0 0 1.9vh}.category-title{margin:0 0 .3vh;padding:.3vh 0;color:#4d5a32;border-bottom:2px solid #4d5a32;font-family:Georgia,serif;font-size:clamp(30px,2.45vw,48px);line-height:1.05;text-transform:uppercase}.item{display:grid;grid-template-columns:minmax(0,1fr) 4vw 7.4vw;align-items:center;column-gap:.65vw;min-height:3.15vh;padding:.42vh 0;border-bottom:1px solid rgba(77,90,50,.17)}.name{min-width:0;font-size:clamp(27px,2.05vw,40px);font-weight:500;line-height:1.08;overflow-wrap:anywhere}.amount{color:#171914;font-size:clamp(24px,1.72vw,34px);font-weight:600;text-align:center;white-space:nowrap}.price{min-width:0;text-align:right;color:#171914;font-size:clamp(27px,2.05vw,40px);font-weight:800;white-space:nowrap}footer{height:4.8vh;display:flex;align-items:end;justify-content:center;color:#4d5a32;border-top:2px solid #4d5a32;font-size:clamp(11px,.9vw,18px);font-weight:800;letter-spacing:.13em;padding-top:.7vh}.fallback{grid-column:1/-1;text-align:center;margin-top:20vh;color:#4d5a32;font-family:Georgia,serif;font-size:3vw}</style></head><body><div class="screen"><header><div class="tag">GOOD FOOD<br>GOOD DRINKS<br>GOOD COMPANY</div><div class="logo-wrap"><img class="logo" src="cremers-logo.png" alt="Café Cremers"></div><div class="tag right">EAT<br>RELAX<br>ENJOY</div></header><main><div id="menu"></div></main><footer>GOOD FOOD BRINGS PEOPLE TOGETHER</footer></div><script>
const DATA_URL="https://script.google.com/macros/s/AKfycbzM2ocIa74JX1Zu2WaAf-Gac_DRX7y6u4qzVO-w7b65hBehjAq8TcpzlJjyUc2RoUEq/exec?tab=Food";
const clean=v=>String(v??"").trim();const available=v=>v===true||["true","yes","1"].includes(clean(v).toLowerCase());const money=v=>{let s=clean(v);if(!s)return"";s=s.replace("€","").trim().replace(".",",");return"€ "+s};
function section(title,items){let s=document.createElement("section");s.className="category";let h=document.createElement("h2");h.className="category-title";h.textContent=title;s.append(h);items.forEach(r=>{let x=document.createElement("div");x.className="item";let n=document.createElement("div");n.className="name";n.textContent=clean(r["Food Name"]);let a=document.createElement("div");a.className="amount";a.textContent=clean(r["Amount"]);let p=document.createElement("div");p.className="price";p.textContent=money(r["Price"]);x.append(n,a,p);s.append(x)});return s}
function render(rows){let m=document.getElementById("menu");m.innerHTML="";let good=rows.filter(r=>available(r.Available)&&clean(r["Food Name"]));if(!good.length){m.innerHTML='<div class="fallback">Food menu coming soon</div>';return}let groups=new Map();good.forEach(r=>{let c=clean(r.Category)||"Food";if(!groups.has(c))groups.set(c,[]);groups.get(c).push(r)});let cols=[document.createElement("div"),document.createElement("div")];cols.forEach(c=>c.className="column");const left=["Meal","Vegetarian Munchies","Munchies With Meat"];const right=["Chef's Specials","Sweets"];const used=new Set();function addCategory(col,wanted){for(const [title,items] of groups){if(clean(title).toLowerCase()===wanted.toLowerCase()){col.append(section(title,items));used.add(title);return}}}left.forEach(x=>addCategory(cols[0],x));right.forEach(x=>addCategory(cols[1],x));for(const [title,items] of groups){if(!used.has(title))cols[1].append(section(title,items))}cols.forEach(c=>m.append(c))}
async function load(){try{let r=await fetch(DATA_URL+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);let d=await r.json();render(Array.isArray(d)?d:(d.data||d.items||[]))}catch(e){console.error(e);document.getElementById("menu").innerHTML='<div class="fallback">Food menu coming soon</div>'}}load();setInterval(load,60000);
</script></body></html>
