<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Cremers — Californian Specials</title>
<style>
:root{--g:#b5852f;--gl:#d8b46d;--ln:#dfcfaa;--b:#111}
*{box-sizing:border-box}
html,body{margin:0;background:#fff!important;color:#111;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
.screen{position:relative;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);margin:auto;background:#fff;overflow:hidden}
@media(max-aspect-ratio:9/16){.screen{width:100vw;height:177.7778vw}}
.frame{position:absolute;inset:1.2%;border:1px solid var(--g);padding:2.3% 3%}
.brand{text-align:center}
.brand img{width:36%;max-height:8%;object-fit:contain}
.kicker{font-size:clamp(7px,1vw,28px);letter-spacing:.28em;text-transform:uppercase}
h1{margin:1% 0 0;font:500 clamp(31px,5.5vw,118px)/.9 Georgia,serif;text-transform:uppercase}
h1 span{display:block;color:var(--g);font-size:72%;letter-spacing:.2em;margin-top:.7%}
.orn{width:42%;margin:1% auto 4%;color:var(--g);display:flex;align-items:center;gap:10px}
.orn:before,.orn:after{content:"";height:1px;background:var(--g);flex:1}
.menu{width:97%;margin:.5% auto 0;display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:1.3%;align-items:stretch}
.panel{border:1px solid var(--ln);border-radius:7px;padding:2.7% 3%;background:#fff}
.head{margin:-8% 0 4%;padding:4% 2%;border:2px solid var(--g);border-radius:6px;background:var(--b);color:var(--gl);text-align:center;font-size:clamp(9px,1.45vw,38px);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.item{border-bottom:1px solid rgba(181,133,47,.28)}
.prefab .item{padding:8% 0 9%}
.prefab .name{font:700 clamp(16px,2.45vw,58px)/1.02 Georgia,serif;text-transform:uppercase}
.prefab .price{font-size:clamp(14px,2.2vw,52px);font-weight:800}
.prefab .meta{font-size:clamp(7px,1.1vw,27px)}
.one .item{padding:3.7% 0 4.1%}
.one .name{font-size:clamp(10px,1.8vw,43px);line-height:1.02;font-weight:800;text-transform:uppercase}
.one .price{font-size:clamp(10px,1.7vw,42px);font-weight:800}
.one .meta{font-size:clamp(6px,.9vw,21px)}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(max-content,18%);gap:10px;align-items:start}.name{min-width:0;overflow-wrap:anywhere}.price{text-align:right;white-space:nowrap}
.meta{margin-top:2%;display:flex;justify-content:space-between;gap:6px;color:var(--g);font-weight:700;text-transform:uppercase}
.deal{background:var(--g);color:#fff;padding:2px 4px;border-radius:3px;white-space:nowrap}
.leaves{margin:10% auto 2%;text-align:center;color:var(--g);font:clamp(18px,3vw,62px) Georgia,serif}
.footer{position:absolute;left:9%;right:9%;bottom:1.6%;padding:1.15% 2%;background:var(--b);color:var(--gl);border:2px solid var(--g);border-radius:6px;text-align:center}
.footer strong{display:block;font-size:clamp(8px,1.1vw,27px);letter-spacing:.15em;text-transform:uppercase}
.footer small{display:block;margin-top:.4%;font-size:clamp(5px,.6vw,15px);letter-spacing:.1em;text-transform:uppercase}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--g);text-transform:uppercase}
</style>
</head>
<body>
<main class="screen">
<div class="frame">
<header class="brand">
<img src="cremers-logo.png" alt="Cremers">
<div class="kicker">Coffeeshop · Since 1990</div>
<h1>Californian <span>Specials</span></h1>
<div class="orn">✦</div>
</header>
<div id="loading">Loading menu…</div>
<section id="menu" class="menu" hidden>
<div class="panel prefab">
<div class="head">❧ 3.5 Gram Prefab ❧</div>
<div id="prefab"></div>
<div class="leaves">❧ ❧ ❧</div>
</div>
<div class="panel one"><div class="head">❧ 1 Gram ❧</div><div id="oneA"></div></div>
<div class="panel one"><div class="head">❧ 1 Gram ❧</div><div id="oneB"></div></div>
</section>
<footer class="footer">
<strong>Premium Californian Genetics</strong>
<small>Carefully selected · Properly grown · Perfectly cured</small>
</footer>
</div>
</main>
<script>
const URL="https://script.google.com/macros/s/AKfycbzyziBjFgHMdxzKvToZ_4Hs5j7gF4xD6Vzk67F6ylPQwzEHN_jNrbtWa6TKtUKXizrdbw/exec";
const ok=v=>["true","yes","1","x","✓","checked"].includes(String(v||"").trim().toLowerCase());
const safe=v=>String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function euro(v){const n=Number(String(v).replace(",","."));return Number.isFinite(n)?"€"+n.toLocaleString("nl-NL",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}):safe(v)}
function card(x){return `<article class="item"><div class="top"><div class="name">${safe(x.Product)}</div><div class="price">${euro(x.Price)}</div></div><div class="meta"><span>${safe(x.Farm)}</span>${x.Deal?`<span class="deal">${safe(x.Deal)}</span>`:""}</div></article>`}
function cremersMenuData(rows){
 const all=rows.filter(x=>String(x.Screen).trim()==="1"&&ok(x.Available)&&x.Product);
 const pre=all.filter(x=>String(x.Section).toLowerCase().includes("3.5"));
 const one=all.filter(x=>String(x.Section).toLowerCase().includes("1 gram"));
 const half=Math.ceil(one.length/2);
 document.getElementById("prefab").innerHTML=pre.map(card).join("");
 document.getElementById("oneA").innerHTML=one.slice(0,half).map(card).join("");
 document.getElementById("oneB").innerHTML=one.slice(half).map(card).join("");
 document.getElementById("loading").hidden=true;
 document.getElementById("menu").hidden=false;
 localStorage.setItem("cremersCache",JSON.stringify(rows));
}
try{const cache=JSON.parse(localStorage.getItem("cremersCache"));if(cache)cremersMenuData(cache)}catch(e){}
async function refresh(){
 try{
   const response=await fetch(URL+"?_="+Date.now(),{cache:"no-store"});
   if(!response.ok) throw new Error("HTTP "+response.status);
   const text=await response.text();

   let rows;
   try{
     rows=JSON.parse(text);
   }catch(e){
     const match=text.match(/^[^(]*\((.*)\)\s*;?\s*$/s);
     if(!match) throw new Error("Unexpected Apps Script response");
     rows=JSON.parse(match[1]);
   }

   if(!Array.isArray(rows)) throw new Error("Menu data is not an array");
   cremersMenuData(rows);
 }catch(error){
   console.error("Live menu update failed:",error);
   const loading=document.getElementById("loading");
   if(!document.getElementById("menu").hidden){
     loading.hidden=true;
   }else{
     loading.textContent="Menu data is taking longer than expected…";
   }
 }
}
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
